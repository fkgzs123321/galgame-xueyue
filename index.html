<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>状态栏 · 血月七夜</title>
<style>
:root{
  --bg-0:#080507;--bg-1:#140a0d;--bg-card:rgba(30,12,14,.88);
  --c-text:#f2e6e0;--c-dim:#9a8f8a;--c-border:rgba(220,80,60,.25);
  --c-blood:#dc2626;--c-moon:#fbbf24;--c-frost:#93c5fd;--c-safe:#10b981;--c-warn:#f59e0b;--c-accent:#c084fc;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs-xs:clamp(10px,2vw,11px);--fs-sm:clamp(11px,2.2vw,12px);--fs-base:clamp(12px,2.5vw,13px);--fs-md:clamp(13px,2.8vw,15px);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);color:var(--c-text);background:transparent;font-size:var(--fs-base);line-height:1.55}
.sb{background:linear-gradient(160deg,var(--bg-0),var(--bg-1));border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;margin:6px 0;box-shadow:0 4px 16px rgba(0,0,0,.55)}
.custom-sb{background:linear-gradient(160deg,var(--bg-0),var(--bg-1));border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;margin:6px 0;box-shadow:0 4px 16px rgba(0,0,0,.55)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--c-border);margin-bottom:8px;flex-wrap:wrap}
.custom-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--c-border);margin-bottom:8px;flex-wrap:wrap}
.hd-l{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.custom-hd-l{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.hd-t{font-size:var(--fs-md);font-weight:800;letter-spacing:1px;color:var(--c-blood)}
.custom-hd-t{font-size:var(--fs-md);font-weight:800;letter-spacing:1px;color:var(--c-blood)}
.pill{font-size:var(--fs-xs);padding:2px 8px;border-radius:10px;background:rgba(220,80,60,.12);border:1px solid var(--c-border);color:#f0b4a8;white-space:nowrap}
.custom-pill{font-size:var(--fs-xs);padding:2px 8px;border-radius:10px;background:rgba(220,80,60,.12);border:1px solid var(--c-border);color:#f0b4a8;white-space:nowrap}
.pill.moon{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35);color:var(--c-moon)}
.custom-pill.custom-moon{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35);color:var(--c-moon)}
.pill.frost{background:rgba(147,197,253,.1);border-color:rgba(147,197,253,.3);color:var(--c-frost)}
.custom-pill.custom-frost{background:rgba(147,197,253,.1);border-color:rgba(147,197,253,.3);color:var(--c-frost)}
.pill.wolf{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.55);color:#fca5a5;font-weight:700}
.custom-pill.custom-wolf{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.55);color:#fca5a5;font-weight:700}
.pill.god{background:rgba(192,132,252,.14);border-color:rgba(192,132,252,.4);color:var(--c-accent);font-weight:700}
.custom-pill.custom-god{background:rgba(192,132,252,.14);border-color:rgba(192,132,252,.4);color:var(--c-accent);font-weight:700}
.pill.civ{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:var(--c-safe);font-weight:700}
.custom-pill.custom-civ{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:var(--c-safe);font-weight:700}
.pill.dead{background:rgba(0,0,0,.4);border-color:rgba(154,143,138,.4);color:var(--c-dim);text-decoration:line-through}
.custom-pill.custom-dead{background:rgba(0,0,0,.4);border-color:rgba(154,143,138,.4);color:var(--c-dim);text-decoration:line-through}
.btn{background:rgba(220,80,60,.14);border:1px solid var(--c-border);color:#f0b4a8;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:var(--fs-sm);transition:all .2s;white-space:nowrap}
.custom-btn{background:rgba(220,80,60,.14);border:1px solid var(--c-border);color:#f0b4a8;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:var(--fs-sm);transition:all .2s;white-space:nowrap}
.btn:hover{background:rgba(220,80,60,.3);color:#fff}
.custom-btn:hover{background:rgba(220,80,60,.3);color:#fff}
.btn.primary{background:rgba(220,38,38,.35);border-color:rgba(220,38,38,.6);color:#fff;font-weight:700}
.custom-btn.custom-primary{background:rgba(220,38,38,.35);border-color:rgba(220,38,38,.6);color:#fff;font-weight:700}
.btn.ghost{background:transparent;border-color:rgba(154,143,138,.3);color:var(--c-dim)}
.custom-btn.custom-ghost{background:transparent;border-color:rgba(154,143,138,.3);color:var(--c-dim)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.custom-btn:disabled{opacity:.35;cursor:not-allowed}
details.block{background:var(--bg-card);border:1px solid var(--c-border);border-radius:8px;padding:0;margin-bottom:8px;overflow:hidden}
details.custom-block{background:var(--bg-card);border:1px solid var(--c-border);border-radius:8px;padding:0;margin-bottom:8px;overflow:hidden}
details.block>summary{font-size:var(--fs-sm);font-weight:700;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;list-style:none}
details.custom-block>summary{font-size:var(--fs-sm);font-weight:700;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;list-style:none}
details.block>summary::-webkit-details-marker{display:none}
details.custom-block>summary::-webkit-details-marker{display:none}
details.block[open]>summary{border-bottom:1px solid var(--c-border)}
details.custom-block[open]>summary{border-bottom:1px solid var(--c-border)}
details.block[open]>summary .caret{transform:rotate(90deg)}
details.custom-block[open]>summary .custom-caret{transform:rotate(90deg)}
details.block>summary .caret{margin-left:auto;transition:transform .2s}
details.custom-block>summary .custom-caret{margin-left:auto;transition:transform .2s}
.t.identity{color:var(--c-moon)}.t.broadcast{color:#f0b4a8}.t.action{color:var(--c-accent)}.t.vote{color:var(--c-blood)}.t.roster{color:var(--c-frost)}.t.mirror{color:var(--c-accent)}.t.end{color:var(--c-blood)}
.custom-t.custom-identity{color:var(--c-moon)}.t.broadcast{color:#f0b4a8}.t.action{color:var(--c-accent)}.t.vote{color:var(--c-blood)}.t.roster{color:var(--c-frost)}.t.mirror{color:var(--c-accent)}.t.end{color:var(--c-blood)}
.block-body{padding:8px 10px 10px}
.custom-block-body{padding:8px 10px 10px}
.muted{color:var(--c-dim);font-size:var(--fs-xs)}
.custom-muted{color:var(--c-dim);font-size:var(--fs-xs)}
.bline{font-size:var(--fs-sm);white-space:pre-wrap;word-break:break-all;line-height:1.6}
.custom-bline{font-size:var(--fs-sm);white-space:pre-wrap;word-break:break-all;line-height:1.6}
.bline b{color:#f0b4a8}
.custom-bline b{color:#f0b4a8}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.custom-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:var(--fs-xs);padding:2px 8px;border-radius:8px;background:rgba(147,197,253,.08);border:1px solid rgba(147,197,253,.2);color:var(--c-frost)}
.custom-chip{font-size:var(--fs-xs);padding:2px 8px;border-radius:8px;background:rgba(147,197,253,.08);border:1px solid rgba(147,197,253,.2);color:var(--c-frost)}
.chip.dead{background:rgba(0,0,0,.3);border-color:rgba(154,143,138,.3);color:var(--c-dim);text-decoration:line-through}
.custom-chip.custom-dead{background:rgba(0,0,0,.3);border-color:rgba(154,143,138,.3);color:var(--c-dim);text-decoration:line-through}
.chip.self{border-color:rgba(251,191,36,.5);color:var(--c-moon)}
.custom-chip.custom-self{border-color:rgba(251,191,36,.5);color:var(--c-moon)}
.dream{background:rgba(251,191,36,.05);border-left:2px solid var(--c-moon);padding:6px 9px;margin:5px 0;font-size:var(--fs-sm);line-height:1.7;white-space:pre-wrap}
.custom-dream{background:rgba(251,191,36,.05);border-left:2px solid var(--c-moon);padding:6px 9px;margin:5px 0;font-size:var(--fs-sm);line-height:1.7;white-space:pre-wrap}
.opt{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.03);border:1px solid rgba(154,143,138,.18);border-radius:7px;padding:7px 9px;margin-bottom:5px;cursor:pointer;transition:all .15s;font-size:var(--fs-sm)}
.custom-opt{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.03);border:1px solid rgba(154,143,138,.18);border-radius:7px;padding:7px 9px;margin-bottom:5px;cursor:pointer;transition:all .15s;font-size:var(--fs-sm)}
.opt:hover{border-color:var(--c-border);background:rgba(220,80,60,.07)}
.custom-opt:hover{border-color:var(--c-border);background:rgba(220,80,60,.07)}
.opt.sel{border-color:rgba(220,80,60,.65);background:rgba(220,38,38,.13)}
.custom-opt.custom-sel{border-color:rgba(220,80,60,.65);background:rgba(220,38,38,.13)}
.opt input{accent-color:#dc2626;flex-shrink:0}
.custom-opt input{accent-color:#dc2626;flex-shrink:0}
.opt .sub{margin-left:auto;font-size:var(--fs-xs);color:var(--c-dim)}
.custom-opt .custom-sub{margin-left:auto;font-size:var(--fs-xs);color:var(--c-dim)}
.opt .sub.safe{color:var(--c-safe)}.opt .sub.warn{color:var(--c-warn)}
.custom-opt .custom-sub.custom-safe{color:var(--c-safe)}.opt .sub.warn{color:var(--c-warn)}
.sect{font-size:var(--fs-xs);color:var(--c-dim);margin:9px 0 5px;font-weight:700;border-bottom:1px solid rgba(220,80,60,.12);padding-bottom:2px}
.custom-sect{font-size:var(--fs-xs);color:var(--c-dim);margin:9px 0 5px;font-weight:700;border-bottom:1px solid rgba(220,80,60,.12);padding-bottom:2px}
.act-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.custom-act-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hint{font-size:var(--fs-xs);color:var(--c-warn);margin:5px 0;line-height:1.5}
.custom-hint{font-size:var(--fs-xs);color:var(--c-warn);margin:5px 0;line-height:1.5}
.hint.moon{color:var(--c-moon)}
.custom-hint.custom-moon{color:var(--c-moon)}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;padding:12px}
.custom-modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:9999;display:none;align-items:center;justify-content:center;padding:12px}
.modal-mask.show{display:flex}
.custom-modal-mask.custom-show{display:flex}
.modal{background:linear-gradient(160deg,var(--bg-0),var(--bg-1));border:1px solid var(--c-border);border-radius:10px;max-width:420px;width:100%;padding:14px}
.custom-modal{background:linear-gradient(160deg,var(--bg-0),var(--bg-1));border:1px solid var(--c-border);border-radius:10px;max-width:420px;width:100%;padding:14px}
.modal h3{font-size:var(--fs-md);color:var(--c-blood);margin-bottom:8px}
.custom-modal h3{font-size:var(--fs-md);color:var(--c-blood);margin-bottom:8px}
.modal p{font-size:var(--fs-sm);color:var(--c-text);margin-bottom:12px;line-height:1.6;white-space:pre-wrap}
.custom-modal p{font-size:var(--fs-sm);color:var(--c-text);margin-bottom:12px;line-height:1.6;white-space:pre-wrap}
.modal .act-row{justify-content:flex-end}
.custom-modal .custom-act-row{justify-content:flex-end}
.loading{text-align:center;padding:28px;color:var(--c-dim);font-size:var(--fs-md);animation:pulse 1.2s ease infinite}
.custom-loading{text-align:center;padding:28px;color:var(--c-dim);font-size:var(--fs-md);animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.err{padding:10px;color:#fca5a5;font-size:12px;line-height:1.6;word-break:break-all}
.custom-err{padding:10px;color:#fca5a5;font-size:12px;line-height:1.6;word-break:break-all}
@media(max-width:420px){.hd{flex-wrap:wrap}.hd-l{width:100%}}
/* 控制中心浮层模式（?cc=1）：满高布局 + 内滚动 */
html.cc-mode,html.cc-mode body{height:100%;overflow-y:auto;background:#0d0a0c}
html.custom-cc-mode,html.custom-cc-mode body{height:100%;overflow-y:auto;background:#0d0a0c}
html.cc-mode body{padding:10px}
html.custom-cc-mode body{padding:10px}
html.cc-mode .sb{margin:0 0 10px}
html.custom-cc-mode .custom-sb{margin:0 0 10px}
</style>
</head>
<body>
<div class="sb" id="xueyue-sb"><div class="loading">血月正在升起…</div></div>
<script type="module">
(function () {
  var ccMode = /[?&]cc=1/.test(location.search);
  if (ccMode) { try { document.documentElement.classList.add('cc-mode'); } catch (e) {} }
  // 幂等：同页重复注入时只刷新，不重复注册（skill：Make binding idempotent）
  if (window.__xyCCAlive) {
    try { if (window.__xyCCRerender) window.__xyCCRerender(); } catch (e) {}
    return;
  }
  window.__xyCCAlive = true;
  /* ===== 酒馆助手接口兼容层（照同级生2 实测可用模式：接口在 window/parent/top 三层找）===== */
  var TH_HOSTS = [window, window.parent, window.top].filter(function (w, i, arr) { return w && arr.indexOf(w) === i; });
  function pickHostFn(name) {
    if (typeof window[name] === 'function') return function () { return window[name].apply(window, arguments); };
    for (var i = 0; i < TH_HOSTS.length; i++) { try { var h = TH_HOSTS[i]; if (typeof h[name] === 'function') return function (host, n) { return function () { return host[n].apply(host, arguments); }; }(h, name); } catch (e) {} }
    return null;
  }
  function pickHostValue(name) {
    if (window[name] !== undefined) return window[name];
    for (var i = 0; i < TH_HOSTS.length; i++) { try { if (TH_HOSTS[i][name] !== undefined) return TH_HOSTS[i][name]; } catch (e) {} }
    return undefined;
  }
  function getV(o) { var f = pickHostFn('getVariables'); if (!f) throw new Error('getVariables 不可用（酒馆助手接口未找到）'); return f(o); }
  function emitEvt(n, p) { var f = pickHostFn('eventEmit'); if (!f) throw new Error('eventEmit 不可用'); return f(n, p); }
  function onEvt(n, f) { var g = pickHostFn('eventOn'); if (!g) return; try { g(n, f); } catch (e) {} }
  function getHost$() { return pickHostValue('$') || pickHostValue('jQuery'); }
  function wait裁判() { var f = pickHostFn('waitGlobalInitialized'); if (!f) return Promise.reject(new Error('waitGlobalInitialized 不可用')); return Promise.race([f('血月裁判'), new Promise(function (_, rej) { setTimeout(function () { rej(new Error('裁判脚本未响应——请确认酒馆助手已加载「血月裁判」脚本')); }, 3500); })]); }
  function slash(c) { var f = pickHostFn('triggerSlash'); if (!f) return Promise.reject(new Error('triggerSlash 不可用')); return f(c); }
  // 控制中心动作：结算（裁判接口）→ 以玩家身份 send 行动 → trigger 生成（原生全链路：正则/MVU/面板渲染自动）
  async function 推进(sendText) { await slash('/send ' + String(sendText).replace(/\|/g, '∣').replace(/"/g, '”') + ' | /trigger await=true'); }

  var SB = '#xueyue-sb';
  var 神职名 = { 铜镜: '狼感铜镜', 药囊: '药炉药囊', 银匕: '祖传银匕', 草汁: '狼毒草汁' };
  var 身份说明 = {
    狼: '血月之子。夜里与同伴围猎，白天伪装成人。',
    铜镜: '镜照一人，雾聚为狼。全庄唯一的真话在你手里。',
    药囊: '一瓶毒药，一份麻沸散。生杀与守护都是你。',
    银匕: '唯一的杀狼之刃。搏命，或以银代众。',
    草汁: '涂门可挡一夜狼牙。存量有限，续采进禁区。',
    民: '你什么都没有，只有脑子和命。',
    未: '血梦未至。今夜月升之后，一切开始。'
  };
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };

  function 读变量() {
    var sv = {};
    var SID = '7f3c9a2e-8b4d-4e6f-9a1c-2d5e8f0a3b6c';
    try { sv = getV({ type: 'script', script_id: SID }) || {}; }
    catch (e1) { try { sv = getV({ type: 'script' }) || {}; } catch (e2) { sv = {}; } }
    // 三级降级链（规范 §5.2）：getVariables → Mvu.getMvuData(getCurrentMessageId) → lastGood
    var cur = null;
    try { cur = getV({ type: 'message', message_id: 'latest' }) || null; if (cur && cur.stat_data) { window.__xyLastGood = cur.stat_data; return { s: cur.stat_data, v: sv }; } } catch (e1) {}
    try {
      var Mvu = pickHostValue('Mvu');
      if (Mvu && Mvu.getMvuData) {
        var mid = 'latest';
        try { var f = pickHostFn('getCurrentMessageId'); if (f) mid = f(); } catch (e) {}
        cur = Mvu.getMvuData({ type: 'message', message_id: mid }) || null;
        if (cur && cur.stat_data) { window.__xyLastGood = cur.stat_data; return { s: cur.stat_data, v: sv }; }
      }
    } catch (e2) {}
    return { s: window.__xyLastGood || null, v: sv };
  }
  function 徽章身份(身) {
    if (身 === '未指派' || !身) return '<span class="pill">身份未指派</span>';
    if (身 === '狼') return '<span class="pill wolf">狼</span>';
    if (身 === '民') return '<span class="pill civ">民</span>';
    return '<span class="pill god">持物 · ' + (神职名[身] || 身) + '</span>';
  }

  function render() {
    var D = 读变量();
    var s = D.s, v = D.v;
    if (!s || !s._世界) { $(SB).html('<div class="loading">变量未就绪——发送第一条消息后开始</div>'); return; }
    var W = s._世界, P = s._玩家;
    var 存活 = W.存活名单.split('|').filter(Boolean);
    var 是夜 = W.阶段 === '夜';
    var 已终局 = /【终局】/.test(W.公开事实 || '');
    var 我 = P.身份, 未指派 = P.身份 === '未指派';
    var 我死 = P.存活 === '死亡';
    var 我持 = function (职) { return s.$物品 && s.$物品[职 + '在身'] === '旅人'; };

    var h = '';
    h += '<div class="hd"><div class="hd-l"><span class="hd-t">血月七夜</span>';
    h += '<span class="pill ' + (是夜 ? 'moon' : 'frost') + '">第 ' + W.天数 + ' ' + (是夜 ? '夜' : '昼') + '</span>';
    h += 徽章身份(未指派 ? '' : 我);
    h += (我死 ? '<span class="pill dead">你死了</span>' : '<span class="pill safe">存活 ' + (存活.length + (我死 ? 0 : 1)) + '/12</span>');
    h += '</div><div style="display:flex;gap:5px;flex-shrink:0">';
    h += '<button class="btn ghost" id="xy-rfr">↻</button>';
    if (ccMode) h += '<button class="btn ghost" id="xy-cc-close">✕</button>';
    if (!已终局 && !未指派) h += '<button class="btn ghost" id="xy-rst">重开</button>';
    h += '</div></div>';

    h += '<details class="block" open><summary><span class="t identity">☰ 你的身份</span><span class="caret">▸</span></summary><div class="block-body">';
    if (未指派) {
      h += '<div class="hint moon">身份说明：' + esc(身份说明.未) + '</div>';
      h += '<div class="hint">发第一条消息，血梦会在月升时找到你。</div>';
      h += '<div class="act-row"><button class="btn primary" id="xy-start">☾ 开始 · 迎接血梦</button></div>';
      h += '<div class="hint">点开始：身份指派 → 第一夜降临 → 面板切换为行动界面</div>';
    } else {
      var 职显示 = 我 === '狼' ? '狼' : 我 === '民' ? '民' : 神职名[我];
      h += '<div class="muted">你是 —— <b style="color:#fbbf24">' + esc(职显示) + '</b></div>';

    }
    function 关浮窗() { try { var f = hD().getElementById(FLOAT_ID); if (f) f.remove(); } catch (e) {} }

    // ── C12 抽屉：右缘滑出 + 遮罩 + 单轴阈值手势 ──
    function 开抽屉() {
      try {
        var d = hD(); 样式();
        if (d.getElementById(DRAWER_ID)) { 关全部(); return; }
        关浮窗();
        var mask = d.createElement('div'); mask.id = 'xy-drawer-mask';
        var dr = d.createElement('div'); dr.id = DRAWER_ID;
        dr.innerHTML = 骨架('抽屉外壳');
        d.body.appendChild(mask); d.body.appendChild(dr);
        请求动画帧(function () { mask.classList.add('on'); dr.classList.add('on'); });
        mask.addEventListener('click', 关全部);
        绑动作(dr);
        // 手势：单轴位移超阈值才判滑动（规范 C12 §6）
        var 手势 = null;
        dr.addEventListener('pointerdown', function (e) {
          if (e.target.closest('button,.xy-shell-body')) return;
          手势 = { x: e.clientX, y: e.clientY, t: Date.now() };
        });
        dr.addEventListener('pointerup', function (e) {
          if (!手势) return;
          var dx = e.clientX - 手势.x, dy = e.clientY - 手势.y;
          if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4 && dx > 0) 关全部(); // 右滑关
          手势 = null;
        });
        刷新内容();
      } catch (e) {}
    }
    function 关抽屉() {
      try {
        var d = hD(); var dr = d.getElementById(DRAWER_ID), mk = d.getElementById('xy-drawer-mask');
        if (dr) { dr.classList.remove('on'); setTimeout(function () { try { dr.remove(); } catch (e) {} }, 230); }
        if (mk) { mk.classList.remove('on'); setTimeout(function () { try { mk.remove(); } catch (e) {} }, 230); }
      } catch (e) {}
    }
    function 关全部() { 关浮窗(); 关抽屉(); 关轮盘(); }
    function 请求动画帧(fn) { try { (hW().requestAnimationFrame || function (cb) { setTimeout(cb, 16); })(fn); } catch (e) { fn(); } }

    // ── C11 悬浮球：统一 pointer 手势 + 吸边 + 持久化 + 轮盘（视口夹取）──
    function 读球位() { try { var o = JSON.parse(hW().localStorage.getItem(KEY_ORB) || 'null'); if (o && o.version === V) return o; } catch (e) {} return { side: 'left', y: Math.round(vh() * 0.62) }; }
    function 存球位(p) { try { hW().localStorage.setItem(KEY_ORB, JSON.stringify({ version: V, ...p })); } catch (e) {} }
    function 放球(球, p) {
      var x = p.side === 'right' ? vw() - 52 - 12 : 12;
      var y = Math.min(Math.max(p.y, 12), vh() - 52 - 12);
      球.style.left = x + 'px'; 球.style.top = y + 'px';
      return { side: p.side, y: y };
    }
    function 关轮盘() { try { var m = hD().getElementById(MENU_ID); if (m) m.classList.remove('on'); } catch (e) {} }
    function 开轮盘(球) {
      try {
        var d = hD(); var m = d.getElementById(MENU_ID);
        if (!m) {
          m = d.createElement('div'); m.id = MENU_ID;
          m.innerHTML = ['<button data-cmd="float">控制中心 · 浮窗</button>', '<button data-cmd="drawer">控制中心 · 抽屉</button>', '<button data-cmd="close">关闭全部</button>'].join('');
          m.addEventListener('click', function (e) {
            var t = e.target.closest('[data-cmd]'); if (!t) return;
            var c = t.getAttribute('data-cmd'); 关轮盘();
            if (c === 'float') 开浮窗(); else if (c === 'drawer') 开抽屉(); else 关全部();
          });
          d.body.appendChild(m);
        }
        var r = 球.getBoundingClientRect();
        var mw = 150, mh = 130;
        var x = Math.min(Math.max(r.right - mw, 8), vw() - mw - 8); // 视口夹取（规范 §6）
        var y = Math.min(Math.max(r.top - mh - 8, 8), vh() - mh - 8);
        m.style.left = x + 'px'; m.style.top = y + 'px';
        m.classList.add('on');
      } catch (e) {}
    }
    function 挂悬浮球() {
      try {
        var d = hD(); 样式();
        var 旧球 = d.getElementById(ORB_ID); if (旧球) 旧球.remove(); // 总是重建（绑定当前逻辑）
        var 球 = d.createElement('div'); 球.id = ORB_ID; 球.title = '血月七夜 · 控制中心';
        球.innerHTML = '☾';
        d.body.appendChild(球);
        var 位 = 放球(球, 读球位());
        var g = null; // 手势状态机：down→可能drag→up（拖动后不触发点击 · 规范 §10）
        var 移过 = false;
        球.addEventListener('pointerdown', function (e) {
          e.preventDefault(); try { 球.setPointerCapture(e.pointerId); } catch (x) {}
          g = { sx: e.clientX, sy: e.clientY, ox: 球.offsetLeft, oy: 球.offsetTop }; 移过 = false;
        });
        球.addEventListener('pointermove', function (e) {
          if (!g) return;
          var dx = e.clientX - g.sx, dy = e.clientY - g.sy;
          if (Math.abs(dx) + Math.abs(dy) > 6) 移过 = true;
          if (移过) {
            球.style.left = Math.min(Math.max(g.ox + dx, 4), vw() - 52 - 4) + 'px';
            球.style.top = Math.min(Math.max(g.oy + dy, 4), vh() - 52 - 4) + 'px';
          }
        });
        球.addEventListener('pointerup', function (e) {
          if (!g) return;
          if (移过) {
            // 吸边（规范：距左右边缘小于阈值时吸附）
            var cx = 球.offsetLeft + 26;
            var side = cx < vw() / 2 ? 'left' : 'right';
            位 = 放球(球, { side: side, y: 球.offsetTop }); 存球位(位);
          } else {
            var m = hD().getElementById(MENU_ID);
            if (m && m.classList.contains('on')) 关轮盘(); else 开轮盘(球);
          }
          g = null;
        });
        球.addEventListener('pointercancel', function () { g = null; });
      } catch (e) {}
    }

    // ── 命令注册表（规范 §1.1：入口只 dispatch 命令，不复制业务）──
    var 命令 = { float: 开浮窗, drawer: 开抽屉, hud: function () {}, close: 关全部 };

    // ── 魔杖入口（C11 §1.2：Wand 使用既有菜单，统一路由）──
    function 魔杖() {
      try {
        var d = hD(); 样式();
        var host = d.querySelector('#extensionsMenu') || d.querySelector('.extensionsMenu') || d.body;
        var wrap = d.getElementById('xy-wand');
        if (!wrap) {
          wrap = d.createElement('span'); wrap.id = 'xy-wand';
          var b = d.createElement('button');
          b.textContent = '血月七夜'; b.title = '控制中心（浮窗/抽屉由悬浮球轮盘切换）';
          b.className = 'menu_button menu_button_icon';
          b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); 开浮窗(); });
          wrap.appendChild(b);
        }
        if (wrap.parentNode !== host) host.appendChild(wrap);
      } catch (e) {}
    }

    function init() {
      try { if (window.__xyEntry && window.__xyEntry.destroy) window.__xyEntry.destroy(); } catch (e) {} // 防重入
      挂悬浮球(); setTimeout(挂悬浮球, 800);
      魔杖(); setTimeout(魔杖, 1000);
      try {
        var on = window.eventOn || hW().eventOn;
        var ev = window.tavern_events || hW().tavern_events || {};
        if (typeof on === 'function') {
          ['CHAT_CHANGED', 'CHARACTER_MESSAGE_RENDERED'].forEach(function (k) {
            if (!ev[k]) return;
            try { var dd = on(ev[k], function () { setTimeout(挂悬浮球, 250); setTimeout(魔杖, 250); }); if (dd && dd.stop) disposers.push(function () { dd.stop(); }); } catch (e) {}
          });
          var Mvu = pickHostValue('Mvu');
          if (Mvu && Mvu.events && Mvu.events.VARIABLE_UPDATE_ENDED) {
            try { on(Mvu.events.VARIABLE_UPDATE_ENDED, function () { setTimeout(刷新内容, 600); }); } catch (e) {}
          }
        }
      } catch (e) {}
      return { open: 开浮窗, openDrawer: 开抽屉, command: function (k) { try { (命令[k] || function () {})(); } catch (e) {} }, destroy: function () { while (disposers.length) { try { disposers.pop()(); } catch (e) {} } 关全部(); try { var b = hD().getElementById(ORB_ID); if (b) b.remove(); } catch (e) {} } };
    }
    return init();
  })();
  try { window.__xyEntry = 入口层; } catch (e) {}



  启动();
  window.__xyCCRerender = function () { try { render(); } catch (e) {} };
  // 状态变化自动刷新（防抖）——操作后/新楼层生成后面板自动更新，无需手动 ↻
  var 刷新计时 = null;
  function 排定刷新() { if (刷新计时) clearTimeout(刷新计时); 刷新计时 = setTimeout(function () { try { render(); } catch (e) {} }, 700); }
  ['generation_ended', 'GENERATION_ENDED', 'message_received', 'MESSAGE_RECEIVED'].forEach(function (n) { onEvt(n, 排定刷新); });
  onEvt('血月-终局', 排定刷新);
  onEvt('血月-已重开', 排定刷新);
})();
</script>
